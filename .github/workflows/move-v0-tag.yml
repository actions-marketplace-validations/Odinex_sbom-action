name: 'Move floating v0 tag'

# The moving major tag `v0` lets users pin `Odinex/sbom-action@v0`.
# GitHub's web UI cannot move an existing tag, so this workflow:
#   1. fires automatically whenever a v0.x.y release is published, and
#   2. can be run manually (workflow_dispatch) to re-point `v0` at the
#      newest v0.x.y release.
# `v0` always tracks the newest v0.x.y release (pre-1.0 by design).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-v0:
    name: 'Point v0 at the newest v0.x.y release commit'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out all history and tags'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Pick the target tag'
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --prune --force origin
          if [ "$EVENT_NAME" = 'release' ]; then
            if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
              echo "Release tag '$RELEASE_TAG' is not a v0.x.y release; leaving v0 alone."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET="$RELEASE_TAG"
          else
            TARGET=$(git tag --list | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -z "$TARGET" ]; then
              echo "No v0.x.y tags found; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "tag=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TARGET"

      - name: 'Move the v0 tag'
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse "${TARGET}^{commit}")
          git tag -f v0 "$SHA"
          git push -f origin refs/tags/v0
          echo "v0 now points at $SHA (the commit tagged $TARGET)."
